name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  demo:
    name: Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            demo/package-lock.json

      - name: Install engine dependencies
        run: npm ci --prefix engine

      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Build
        run: npm run typecheck --prefix demo

      - name: Test
        run: npm test --prefix demo
