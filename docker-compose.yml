services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: air_demo
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air -d air_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      GITHUB_WEBHOOK_SECRET: dev-secret
      DATABASE_URL: postgres://air:air@postgres:5432/air_demo
    ports:
      - "3300:3300"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
